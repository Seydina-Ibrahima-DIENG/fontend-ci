# Configuration Nginx du frontend Jangalma
server {
    listen 8080;
    server_name _;

    # Dossier contenant le build Angular
    root /usr/share/nginx/html;
    index index.html;

    # Taille max des fichiers envoyés (dépôt de ressources : 10 Mo)
    client_max_body_size 10m;

    # DNS interne de Docker : retrouve "api-gateway" par son nom.
    # Grâce à la variable plus bas, Nginx démarre même si la gateway n'est pas encore là.
    # valid=5s : pendant un déploiement sans coupure, la nouvelle gateway est vue en 5 s au plus.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # 1) Health check du frontend (utilisé par Docker Compose et le pipeline CD)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'UP';
    }

    # 2) Les appels API sont transmis à la gateway du backend
    location /api/ {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;

        # Déploiement sans coupure : pendant la bascule, "api-gateway" désigne 2 instances.
        # Si l'une ne répond pas (ancienne instance en cours d'arrêt), on échoue vite
        # et on réessaie aussitôt sur l'autre, au lieu de faire attendre l'utilisateur.
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3) Toutes les autres adresses : l'application Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}